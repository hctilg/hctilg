<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Audio Spectrogram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .controls {
            height: 80px;
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #444;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0052a3;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        label {
            font-size: 13px;
            white-space: nowrap;
        }

        .spectrogram-container {
            flex: 1;
            overflow: auto;
            background: #111;
        }

        #spectrogramCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info-text {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <button id="startBtn">شروع</button>
                <button id="stopBtn" disabled>توقف</button>
            </div>
            <div class="control-group">
                <label for="fftSize">FFT Size:</label>
                <select id="fftSize">
                    <option value="512">512</option>
                    <option value="1024" selected>1024</option>
                    <option value="2048">2048</option>
                    <option value="4096">4096</option>
                </select>
            </div>
            <div class="control-group">
                <label for="smoothing">Smoothing:</label>
                <input type="range" id="smoothing" min="0" max="0.99" step="0.01" value="0.8">
            </div>
            <div class="control-group">
                <label for="colormap">Colormap:</label>
                <select id="colormap">
                    <option value="inferno" selected>Inferno</option>
                    <option value="viridis">Viridis</option>
                    <option value="plasma">Plasma</option>
                    <option value="cool">Cool</option>
                </select>
            </div>
            <div class="control-group">
                <label for="dbRange">dB Range:</label>
                <input type="range" id="dbRange" min="20" max="120" step="10" value="80">
                <span class="info-text"><span id="dbValue">80</span> dB</span>
            </div>
        </div>
        <div class="spectrogram-container">
            <canvas id="spectrogramCanvas"></canvas>
        </div>
    </div>

    <script src="audioworklet.js"></script>
    <script src="fft.js"></script>
    <script src="colormap.js"></script>
    <script src="spectrogram.js"></script>
</body>
</html>
